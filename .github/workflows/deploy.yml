name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # One entry per [env.NAME] block in wrangler.toml — every site this
        # repo serves gets deployed on every push. Add a new site by adding
        # its name here and its [env.NAME] block in wrangler.toml.
        site: [gcameron,laax-ski,caitlin-ski,allaboutthevibes]
      fail-fast: false
    steps:
      # CF secrets are repo-level, shared by every site. Skip cleanly when
      # absent (covers the first pre-secrets push).
      - name: Check Cloudflare credentials
        id: creds
        run: echo "ok=${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.creds.outputs.ok == 'true'
        uses: actions/checkout@v6

      # cloudflare/wrangler-action@v3 used to run this step, but its own
      # "Wrangler not found, installing..." fallback ignored the pinned
      # wranglerVersion input and hardcoded an install of wrangler@3.90.0 —
      # confirmed in a run's own log. Wrangler 3.x predates the Workers
      # Static Assets config this Worker depends on (run_worker_first, the
      # [assets] binding), so it silently did nothing with those keys: a
      # deploy that "succeeded" while quietly not enforcing the Phase 2
      # hostname split in production. Installing from package-lock.json
      # (npm ci) and running wrangler directly removes that whole layer of
      # "trust a third-party action's version-resolution logic" — this
      # installs exactly the wrangler version pinned by
      # @cloudflare/vitest-pool-workers's own dependency, the same one every
      # local dry-run/dev test in this repo already runs against.
      - name: Install dependencies
        if: steps.creds.outputs.ok == 'true'
        run: npm ci

      # #20, stage 1 of 2: read-only check that this site's D1 migration
      # bookkeeping (d1_migrations, baselined by hand for 0001-0009) agrees
      # with migrations/. Nothing is applied yet — once every site reports
      # "No migrations to apply" here, this becomes `migrations apply`.
      # Deliberately non-blocking while it's only a check: an unexpected
      # result raises a warning annotation on the run, not a failed deploy.
      - name: Check pending D1 migrations (${{ matrix.site }})
        if: steps.creds.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          if ! npx wrangler d1 migrations list DB --env ${{ matrix.site }} --remote 2>&1 | tee "$RUNNER_TEMP/migrations.log"; then
            echo "::warning title=D1 migrations (${{ matrix.site }})::wrangler d1 migrations list failed — see this step's log"
          elif ! grep -q "No migrations to apply" "$RUNNER_TEMP/migrations.log"; then
            echo "::warning title=D1 migrations (${{ matrix.site }})::Pending D1 migrations found — see this step's log"
          fi

      - name: Deploy ${{ matrix.site }}
        if: steps.creds.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env ${{ matrix.site }}