<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <script src="/assets/js/theme-init.js"></script>
    <meta name="robots" content="noindex, nofollow" />
    <title>Dashboard — add-blog admin</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" sizes="any" />
    <link rel="icon" href="/assets/favicon-32x32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="stylesheet" href="/assets/css/styles.css" />
    <link rel="stylesheet" href="/assets/css/admin.css" />
    <script type="module" src="/assets/js/admin.js"></script>
  </head>
  <body class="admin" data-page="dashboard">
    <a class="skip-link" href="#main">Skip to content</a>

    <div class="admin-layout">
      <aside class="admin-sidebar" data-sidebar></aside>

      <main class="admin-main" id="main" data-demo-slot>
        <div class="admin-header">
          <div>
            <h1>Dashboard</h1>
            <p>What is live, what is waiting, and what changed recently.</p>
          </div>
          <div class="admin-header__actions">
            <button class="btn" type="button" data-theme-toggle aria-label="Toggle theme"></button>
            <a class="btn btn--primary" href="/admin/editor/">Write a post</a>
          </div>
        </div>

        <div class="stat-grid" data-stats></div>
        <div data-next-scheduled></div>

        <div class="card card--flush">
          <div class="card__header">
            <h2>Recently edited</h2>
            <a class="btn btn--sm" href="/admin/posts/">All posts</a>
          </div>
          <div data-recent></div>
        </div>

        <div class="card">
          <div class="card__header"><h2>Recent Activity</h2></div>
          <div data-activity></div>
          <p class="small muted" style="margin: 1rem 0 0">
            See the <a href="/admin/audit/">complete activity log</a> for the full history,
            filterable by actor, action, and source.
          </p>
        </div>
      </main>
    </div>
  </body>
</html>
