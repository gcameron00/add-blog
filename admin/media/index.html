<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Media — add-blog admin</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/css/styles.css" />
    <link rel="stylesheet" href="/assets/css/admin.css" />
    <script type="module" src="/assets/js/admin.js"></script>
  </head>
  <body class="admin" data-page="media">
    <a class="skip-link" href="#main">Skip to content</a>

    <div class="admin-layout">
      <aside class="admin-sidebar" data-sidebar></aside>

      <main class="admin-main" id="main" data-demo-slot>
        <div class="admin-header">
          <div>
            <h1>Media</h1>
            <p>Everything in the R2 bucket, with the D1 row that describes it.</p>
          </div>
          <div class="admin-header__actions">
            <button class="btn" type="button" data-theme-toggle aria-label="Toggle theme"></button>
          </div>
        </div>

        <div class="card card--flush">
          <div class="filters">
            <label class="search-field">
              <span class="visually-hidden">Search files</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true">
                <circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" />
              </svg>
              <input type="search" placeholder="Search filenames and alt text…" data-search autocomplete="off" />
            </label>

            <label class="visually-hidden" for="type">Filter by type</label>
            <select id="type" data-type-filter>
              <option value="all">All types</option>
              <option value="image">Images</option>
              <option value="application">Documents</option>
            </select>
          </div>

          <div class="dropzone" data-dropzone>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 16V4m0 0L8 8m4-4 4 4" /><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3" />
            </svg>
            <strong>Drop files here, or choose one or more</strong>
            <p class="small" style="margin: 0 0 .75rem">
              Images (JPEG, PNG, WebP, AVIF, GIF) or PDF, up to 25 MB each. Add alt text
              afterward from each file's card — files missing it are flagged below until
              you do.
            </p>
            <label class="btn btn--sm" for="media-file">
              Choose files
              <input
                type="file"
                id="media-file"
                data-file-input
                class="visually-hidden"
                multiple
                accept="image/jpeg,image/png,image/webp,image/avif,image/gif,application/pdf"
              />
            </label>
            <div data-upload-status class="small" style="margin-top: .5rem; min-height: 1.2em" aria-live="polite"></div>
          </div>

          <div data-media aria-live="polite"></div>
        </div>
      </main>
    </div>
  </body>
</html>
