<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <script src="/assets/js/theme-init.js"></script>
    <title>Archive — The add-blog Journal</title>
    <meta name="description" content="Every post, grouped by year." />
    <link rel="canonical" href="/archive/" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" sizes="any" />
    <link rel="icon" href="/assets/favicon-32x32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="stylesheet" href="/assets/css/styles.css" />
    <script type="module" src="/assets/js/blog.js"></script>
  </head>
  <body data-page="archive">
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
      <div class="wrap site-header__inner">
        <a class="brand" href="/">
          <svg viewBox="0 0 32 32" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent)">
            <path d="M6 16 L13 23 L26 9" />
          </svg>
          <span>The add-blog Journal</span>
        </a>
        <nav class="site-nav" aria-label="Main">
          <a href="/">Posts</a>
          <a href="/archive/">Archive</a>
          <a href="/tags/">Tags</a>
          <a href="/about/">About</a>
          <button class="theme-toggle" type="button" data-theme-toggle aria-label="Toggle theme"></button>
        </nav>
      </div>
    </header>

    <main id="main">
      <div class="wrap wrap--prose" data-demo-slot>
        <div class="hero">
          <h1>Archive</h1>
          <p>Every post, oldest sections last.</p>
        </div>
        <div data-archive></div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="wrap site-footer__inner">
        <p style="margin: 0">© <span data-year>2026</span> The add-blog Journal</p>
        <nav aria-label="Footer">
          <a href="/about/">About</a>
          <a href="/archive/">Archive</a>
          <a href="/feed.xml">RSS</a>
          <a href="/admin/">Admin</a>
        </nav>
      </div>
    </footer>
  </body>
</html>
