<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <script src="/assets/js/theme-init.js"></script>
    <title>The add-blog Journal</title>
    <meta name="description" content="Notes on building a blog engine for Cloudflare Workers — routing, storage, caching, and giving agents a way in." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="The add-blog Journal" />
    <meta property="og:description" content="Notes on building a blog engine for Cloudflare Workers." />
    <link rel="canonical" href="/" />
    <link rel="alternate" type="application/rss+xml" title="The add-blog Journal" href="/feed.xml" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" sizes="any" />
    <link rel="icon" href="/assets/favicon-32x32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="stylesheet" href="/assets/css/styles.css" />
    <script type="module" src="/assets/js/blog.js"></script>
  </head>
  <body data-page="home">
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
      <div class="wrap site-header__inner">
        <a class="brand" href="/">
          <svg viewBox="0 0 32 32" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent)">
            <path d="M6 16 L13 23 L26 9" />
          </svg>
          <span>The add-blog Journal</span>
        </a>
        <nav class="site-nav" aria-label="Main">
          <a href="/">Posts</a>
          <a href="/archive/">Archive</a>
          <a href="/tags/">Tags</a>
          <a href="/about/">About</a>
          <button class="theme-toggle" type="button" data-theme-toggle aria-label="Toggle theme"></button>
        </nav>
      </div>
    </header>

    <main id="main">
      <div class="wrap" data-demo-slot>
        <div class="hero">
          <h1>The add-blog Journal</h1>
          <p>
            Notes on building a blog engine for Cloudflare Workers — routing, storage,
            caching, and giving agents a way in.
          </p>
        </div>

        <div class="toolbar">
          <label class="search-field">
            <span class="visually-hidden">Search posts</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true">
              <circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" />
            </svg>
            <input type="search" placeholder="Search posts…" data-search autocomplete="off" />
          </label>
          <div class="tag-list" data-tag-bar aria-label="Popular tags"></div>
        </div>

        <div class="post-list" data-post-list></div>

        <div class="pagination">
          <button class="btn" type="button" data-load-more hidden>Load more posts</button>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="wrap site-footer__inner">
        <p style="margin: 0">© <span data-year>2026</span> The add-blog Journal</p>
        <nav aria-label="Footer">
          <a href="/about/">About</a>
          <a href="/archive/">Archive</a>
          <a href="/feed.xml">RSS</a>
          <a href="/admin/">Admin</a>
        </nav>
      </div>
    </footer>
  </body>
</html>
