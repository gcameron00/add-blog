# One repo, one shared Worker script (src/index.js), many independent sites —
# each site is its own [env.NAME] block below, deployed separately via
# `wrangler deploy --env NAME` (see .github/workflows/deploy.yml, which runs
# one deploy per site on every push to main). Nothing about a site is generic
# code that changes per deployment; it is all here, in config.
#
# To add a new blog:
#   1. Add the domain as a zone in Cloudflare (nameservers pointed at CF) —
#      the routes below can't attach to a zone that doesn't exist yet.
#   2. Copy an [env.NAME] block, change the name/routes/vars for the new site.
#   3. Add the same NAME to the `site` matrix in deploy.yml.
#   4. Push. `wrangler deploy --env NAME` creates the Worker on first run —
#      there is no separate "create the Worker" step.
#
# Each site's [[env.NAME.d1_databases]]/[[env.NAME.r2_buckets]] only work
# once that site's D1 database and R2 bucket actually exist (a database_id
# that doesn't exist fails the whole deploy — every site, not just that
# one) — see docs/deployment.md §1 for the create-then-bind sequence.
name = "add-blog"
main = "src/index.js"
compatibility_date = "2026-07-01"
workers_dev = true

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = true

# --- gcameron.com -------------------------------------------------------

[env.gcameron]
name = "gcameron-blog"
routes = [
  { pattern = "blog.gcameron.com",       custom_domain = true },
  { pattern = "blog-admin.gcameron.com", custom_domain = true },
]

# Phase 3 — this site's own D1 database and R2 bucket (never shared with
# any other site — see the single-tenant decision in implementation-plan.md).
# Schema and seed applied via the commands in docs/deployment.md §1.
[[env.gcameron.d1_databases]]
binding = "DB"
database_name = "gcameron-blog"
database_id = "50455d78-b9b4-4d74-bc57-4798b58dc99b"

[[env.gcameron.r2_buckets]]
binding = "MEDIA"
bucket_name = "gcameron-blog-media"

# Deliberately repeated rather than relied on as inherited from the
# top-level [assets] above — production kept serving static assets for
# /admin/* without ever invoking the Worker (confirmed with Development Mode
# on, so it isn't a caching issue: request never reaches src/index.js's
# guard at all), which is exactly the symptom of run_worker_first not being
# active for this environment specifically. Repeating it here removes the
# question of whether [assets] inherits into [env.NAME] instead of relying
# on an assumption that didn't hold up against the real deploy.
[env.gcameron.assets]
directory = "."
binding = "ASSETS"
run_worker_first = true

[env.gcameron.vars]
ADMIN_HOST = "blog-admin.gcameron.com"
PUBLIC_HOST = "blog.gcameron.com"

# Phase 4 — Access application over blog-admin.gcameron.com. Non-secret: see
# docs/deployment.md §5 on why these are plain vars, not `wrangler secret`s.
ACCESS_TEAM_DOMAIN = "grahamcameron.cloudflareaccess.com"
ACCESS_AUD = "1d519becd47d98d3f450013b2124ab97d5ce468452735bd8bfb71f87b5941ca6"

# Phase 5f — sweeps `scheduled` posts to `published` every 5 minutes (src/cron.js).
# A standing, automatically-firing job — added only after an explicit
# owner conversation, per docs/implementation-plan.md's Phase 5 note.
# A TOML table header applies to every key that follows until the next one —
# this one must come after every [env.gcameron.vars] key above, never between
# them, or those later keys silently join *this* table instead (see git
# history: that exact mistake briefly took ACCESS_TEAM_DOMAIN/ACCESS_AUD out
# of vars and disabled the Worker's own Access check in production).
[env.gcameron.triggers]
crons = ["*/5 * * * *"]

# --- caitlincameron.ski -------------------------------------------------------

[env.caitlin-ski]
name = "caitlin-ski-blog"
routes = [
  { pattern = "blog.caitlincameron.ski>",       custom_domain = true },
  { pattern = "blog-admin.caitlincameron.ski>", custom_domain = true },
]

[[env.caitlin-ski.d1_databases]]
binding = "DB"
database_name = "caitlin-ski-blog"
database_id = "7c3c491a-3849-4f7d-bb48-0b3338be5083"

[[env.caitlin-ski.r2_buckets]]
binding = "MEDIA"
bucket_name = "caitlin-ski-blog-media"

[env.caitlin-ski.assets]
directory = "."
binding = "ASSETS"
run_worker_first = true

[env.caitlin-ski.vars]
ADMIN_HOST = "blog-admin.caitlincameron.ski"
PUBLIC_HOST = "blog.caitlincameron.ski"
ACCESS_TEAM_DOMAIN = "grahamcameron.cloudflareaccess.com"
ACCESS_AUD = "0c8f399218802f83ada746e3d6d17a961eec1caa6ad48b7de4bec01d3020f0a5"

# Optional — only if you want scheduled posts to auto-publish on this site:
[env.caitlin-ski.triggers]
crons = ["*/5 * * * *"]
